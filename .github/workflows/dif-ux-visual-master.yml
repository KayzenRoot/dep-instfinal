name: DIF UX visual master integrity
on:
  push:
    branches:
      - docs/dif-ux-wo-001-neon-glass-master-v1
    paths:
      - 'docs/design/neon-glass-v1/**'
      - '.github/workflows/dif-ux-visual-master.yml'
  pull_request:
    paths:
      - 'docs/design/neon-glass-v1/**'
      - '.github/workflows/dif-ux-visual-master.yml'

permissions:
  contents: read

jobs:
  dif-ux-master:
    name: Neon Glass assets SHA256 9 of 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test fail-closed image verifier
        run: node --test docs/design/neon-glass-v1/verify-images.test.mjs
      - name: Verify every master PNG against committed manifest
        run: node docs/design/neon-glass-v1/verify-images.mjs
