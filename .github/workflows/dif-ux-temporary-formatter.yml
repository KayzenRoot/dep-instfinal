name: DIF-UX-WO-001 ephemeral formatter
on:
  push:
    branches:
      - docs/dif-ux-wo-001-neon-glass-master-v1
jobs:
  formatter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Format and print exact patch, read-only
        run: |
          npx prettier --write docs/design/neon-glass-v1/verify-images.mjs docs/design/neon-glass-v1/verify-images.test.mjs
          git diff -- docs/design/neon-glass-v1/verify-images.mjs docs/design/neon-glass-v1/verify-images.test.mjs
