# Temporary, branch-scoped lockfile regeneration for DIF-REL-001.
# Remove this workflow after the npm lock is committed and CI has passed.
name: DIF lockfile sync (one-shot)
on:
  push:
    branches: [feat/dif-studio-mvp-001]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only dependency lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sync lockfile for pinned Vercel adapter'
          git push origin HEAD:feat/dif-studio-mvp-001
