name: Audio Mix ARM64 Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/benchmark-audio-mix.ts'
      - 'src/lib/domain/render-composition.ts'
      - 'src/lib/domain/audio-template.ts'
      - '.github/workflows/audio-mix-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg time
      - run: npm ci
      - name: Run 120s audio mix benchmark
        env:
          BENCH_TIME_FILE: ${{ github.workspace }}/arm64-time.txt
        run: npm run benchmark:audio-mix | tee audio-mix-arm64.json
      - uses: actions/upload-artifact@v6
        with:
          name: audio-mix-arm64-benchmark
          path: |
            audio-mix-arm64.json
            arm64-time.txt
          retention-days: 30
