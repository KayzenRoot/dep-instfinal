name: Color Render ARM64 Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/benchmark-color-render.ts'
      - 'src/lib/domain/color-grade.ts'
      - 'src/lib/domain/render-composition.ts'
      - '.github/workflows/color-render-benchmark.yml'

permissions:
  contents: read

jobs:
  color-render:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - name: Render 10s 720p/1080p with and without Color Match
        run: npm run --silent benchmark:color-render | tee color-render-arm64.json
      - uses: actions/upload-artifact@v6
        with:
          name: color-render-arm64-benchmark
          path: color-render-arm64.json
          retention-days: 30
