# Temporary one-shot release formatting, removed after its bot push.
name: DIF final V1 formatting once
on:
  push:
    branches: [feat/dif-studio-mvp-001]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prettier for release changes
        run: |
          npx prettier --write src/routes/api/media/private-access.test.ts \
            docs/SOURCE_PACK.md docs/OPERATIONS.md \
            docs/EVIDENCE_BUNDLE.md docs/CHECKPOINT_DELTA.md
      - name: Commit reviewed formatting scope
        run: |
          git add src/routes/api/media/private-access.test.ts \
            docs/SOURCE_PACK.md docs/OPERATIONS.md \
            docs/EVIDENCE_BUNDLE.md docs/CHECKPOINT_DELTA.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format final V1 release evidence and media tests'
          git push origin HEAD:feat/dif-studio-mvp-001
