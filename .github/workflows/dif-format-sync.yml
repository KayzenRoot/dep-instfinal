# Temporary branch-only workflow to format DIF-REL-001 files. Remove once complete.
name: DIF one-shot format
on:
  push:
    branches: [feat/dif-studio-mvp-001]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format the changed feature files
        run: |
          npx prettier --write \
            src/lib/server/ai-episode.ts \
            src/lib/server/ai-episode.test.ts \
            'src/routes/app/episodes/[episodeId]/+page.server.ts' \
            'src/routes/app/episodes/[episodeId]/+page.svelte'
      - name: Commit only formatted feature files
        run: |
          git add src/lib/server/ai-episode.ts src/lib/server/ai-episode.test.ts \
            'src/routes/app/episodes/[episodeId]/+page.server.ts' \
            'src/routes/app/episodes/[episodeId]/+page.svelte'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format AI generation feature'
          git push origin HEAD:feat/dif-studio-mvp-001
